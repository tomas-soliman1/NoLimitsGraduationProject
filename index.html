<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coursera Plus</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#14182b;--mu:#667;--pr:#4f46e5;--ok:#16a34a;--dg:#dc2626;--wn:#d97706;--bd:#e3e6ef;--sh:0 4px 14px rgba(20,24,43,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.7;display:flex;flex-direction:column;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.logo{font-weight:800;font-size:1.2rem;cursor:pointer}
.u{display:flex;align-items:center;gap:10px;font-size:.9rem}
main{max-width:1100px;width:100%;margin:0 auto;padding:20px;flex:1}
footer{background:var(--card);border-top:1px solid var(--bd);padding:22px 20px;margin-top:40px;text-align:center;color:var(--mu);font-size:.9rem}
footer .f-links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:8px}
footer a{color:var(--tx);text-decoration:none;font-weight:600;cursor:pointer}
footer a:hover{color:var(--pr)}
button{font-family:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 18px;font-size:.95rem;font-weight:600;background:var(--pr);color:#fff;transition:.15s}
button:hover{opacity:.92}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.ok{background:var(--ok)}
button.dg{background:var(--dg)}
button.wn{background:var(--wn)}
button.sm{padding:5px 12px;font-size:.82rem;border-radius:8px}
button:disabled{opacity:.6;cursor:wait}
input,select{width:100%;padding:11px;margin:5px 0;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-family:inherit;font-size:.95rem}
.err{color:var(--dg);font-size:.88rem;min-height:1.4em;margin-top:4px}
.mu{color:var(--mu)}
.home{text-align:center;padding:40px 0}.home h1{font-size:2.2rem;margin:8px 0}
.roles{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.role{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px 36px;cursor:pointer;min-width:210px;box-shadow:var(--sh)}
.role:hover{border-color:var(--pr)}.role span{font-size:3rem;display:block}.role small{color:var(--mu)}
.auth{max-width:380px;margin:30px auto;background:var(--card);padding:26px;border-radius:16px;box-shadow:var(--sh);border:1px solid var(--bd)}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.c{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--bd);cursor:pointer}
.po{height:130px;display:flex;align-items:center;justify-content:center;font-size:3.4rem;position:relative}
.bd{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);color:#fff;font-size:.75rem;padding:2px 10px;border-radius:20px}
.bd.pend{background:var(--wn)}
.cb{padding:12px 14px}.cb h3{margin:0 0 4px;font-size:1.05rem}.cb p{margin:0;color:var(--mu);font-size:.87rem}
.bar{height:7px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0;min-width:70px}.bar i{display:block;height:100%;background:var(--ok)}
.hero{border-radius:16px;padding:26px;display:flex;gap:18px;align-items:center;color:#fff;flex-wrap:wrap}
.hero .e{font-size:4.5rem}.hero h1{margin:0}.hero p{margin:4px 0 0;opacity:.92}
.box{display:block;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:14px}
.les{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid var(--bd)}
.les:last-child{border:0}.les.d span{color:var(--ok)}.les.cur{background:rgba(79,70,229,.08);border-radius:8px;padding-inline:10px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;overflow-y:auto}
.md{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:440px;box-shadow:0 10px 30px rgba(0,0,0,.2)}.md h3{margin-top:0}
.r2{display:flex;gap:8px}
.pw{position:relative}.pw input{padding-left:46px}.pw button{position:absolute;left:5px;top:8px;padding:2px 8px;background:transparent;color:var(--mu);border:0;font-size:1.1rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0 22px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;text-align:center}
.st b{display:block;font-size:1.7rem}
summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.act{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:.75rem;padding:2px 9px;border-radius:20px;font-weight:700;direction:ltr}
.tag.av{background:#dcfce7;color:#15803d}
.tag.un{background:#fee2e2;color:#b91c1c}
.tag.pn{background:#fef3c7;color:#b45309}
.tw{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:8px;text-align:right;border-bottom:1px solid var(--bd)}

/* أنماط بوابة الدفع الواقعية */
.pm-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.pm-tab{padding:8px 4px;border:1.5px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:.78rem;text-align:center;cursor:pointer;font-weight:700}
.pm-tab.active{border-color:var(--pr);background:rgba(79,70,229,.08);color:var(--pr)}
.pm-tab span{display:block;font-size:1.3rem;margin-bottom:2px}
.pay-info{background:var(--bg);border:1px dashed var(--bd);border-radius:10px;padding:12px;margin:10px 0;font-size:.88rem}
.copy-box{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:6px 10px;border-radius:8px;border:1px solid var(--bd);margin-top:6px;font-family:monospace;font-size:.95rem}
.receipt{border:1px dashed var(--bd);background:var(--bg);border-radius:12px;padding:14px;text-align:right;font-size:.86rem;margin:12px 0}
.receipt div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bd)}
.receipt div:last-child{border:0}
.secure-badge{display:flex;align-items:center;justify-content:center;gap:6px;font-size:.75rem;color:var(--ok);margin-top:10px;font-weight:600}
</style>
</head>
<body>
<header><div class="logo" onclick="location.hash='courses'">🎓 Coursera Plus</div><div class="u" id="hu"></div></header>
<main id="app"></main>
<footer>
  <div class="f-links">
    <a onclick="location.hash=''">الرئيسية</a>
    <a onclick="location.hash='courses'">الكورسات</a>
    <a onclick="location.hash='student'">بوابة الطالب</a>
    <a onclick="location.hash='adminlogin'">لوحة الأدمن</a>
  </div>
  <div>© 2026 <b>Coursera Plus</b> — جميع الحقوق محفوظة | تطوير فريق NoLimitsTeam</div>
</footer>

<script>
var G=["#6366f1,#312e81","#f59e0b,#b45309","#10b981,#065f46","#ec4899,#9d174d","#06b6d4,#155e75","#ef4444,#991b1b","#8b5cf6,#5b21b6","#84cc16,#3f6212","#f97316,#9a3412","#14b8a6,#115e59","#3b82f6,#1e3a8a","#a855f7,#6b21a8","#eab308,#854d0e","#64748b,#1e293b","#d946ef,#86198f"];
var INIT_C=[
 ["برمجة بايثون","🐍","تعلم البرمجة من الصفر بلغة بايثون السهلة."],
 ["تطوير الويب","🌐","HTML وCSS وJavaScript لبناء مواقعك."],
 ["تصميم الجرافيك","🎨","أساسيات التصميم وصناعة الهويات البصرية."],
 ["الذكاء الاصطناعي","🤖","مدخل مبسط لعالم AI والتعلم الآلي."],
 ["تحليل البيانات","📊","حلل البيانات واستخرج منها قرارات."],
 ["اللغة الإنجليزية","🗣️","محادثة وقواعد لمستوى أفضل كل يوم."],
 ["التسويق الرقمي","📣","إعلانات وسوشيال ميديا ونمو المبيعات."],
 ["الأمن السيبراني","🔐","احمِ نفسك وأنظمتك من الاختراق."],
 ["تطبيقات الموبايل","📱","ابنِ تطبيقات أندرويد وiOS."],
 ["المونتاج والفيديو","🎬","من التصوير للمونتاج وصناعة المحتوى."],
 ["الأعمال وريادتها","💼","ابدأ مشروعك وأدره بشكل صحيح."],
 ["الموسيقى","🎹","أساسيات النظرية والعزف الأول."],
 ["الرياضيات","🧮","اختصر الطريق لفهم الرياضيات بسهولة."],
 ["الشبكات","🛰️","أساسيات الشبكات والاتصالات."],
 ["التصوير الفوتوغرافي","📷","الإضاءة والتكوين واحتراف الكاميرا."]
];
var L=["مقدمة عن %","الأساسيات الأولى","التطبيق العملي","مفاهيم متقدمة","مشروع تطبيقي","المراجعة والاختبار"];
var ADMIN={u:"NoLimitsTeam",p:"NoLimits1"};
var $=function(i){return document.getElementById(i)};
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
var mem={};
function get(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return mem[k]||d}}
function save(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- إدارة الكورسات ---------- */
function courses(){
 var c=get('cc',null);
 if(!c){
  c=INIT_C.map(function(x,i){return {id:String(i),title:x[0],icon:x[1],desc:x[2],price:150+(i%5)*50,available:true,g:i%G.length}});
  save('cc',c);
 }
 return c;
}
function findCourse(id){return courses().find(function(x){return x.id===String(id)})}

function users(){return get('cu',{})}
function prog(){return get('cp',{})}
function txns(){return get('cy',{})} // سجل المعاملات المالية
function sess(){
 var s=get('cs',null);
 if(s&&s.role=='admin')return s;
 if(s&&s.role=='student'&&users()[s.email])return s;
 return null}
function me(){var s=sess();return s&&s.role=='student'?s.email:null}
function myp(id){var p=prog(),e=me();return e&&p[e]&&p[e][id]?p[e][id]:null}
function myTx(id){var y=txns(),e=me();return e&&y[e]&&y[e][id]?y[e][id]:null}

/* ---------- الصفحة الأولى ---------- */
function home(){
 $('app').innerHTML='<div class="home"><div style="font-size:4rem">🎓</div><h1>أهلاً بيك في Coursera Plus</h1><p class="mu">اختار دخولك للمنصة</p><div class="roles"><div class="role" onclick="location.hash=\'student\'"><span>🎓</span><b>طالب</b><br><small>تصفح الكورسات وسجّل فيها</small></div><div class="role" onclick="location.hash=\'adminlogin\'"><span>🛠️</span><b>أدمن</b><br><small>إحصائيات المنصة وإدارة المدفوعات</small></div></div></div>';
}

/* ---------- دخول الطالب ---------- */
var mode='in';
function auth(){
 $('app').innerHTML='<div class="auth"><button class="g" onclick="location.hash=\'\'">→ رجوع</button><h2>دخول الطالب</h2><div class="tabs"><button class="'+(mode=='in'?'':'g')+'" onclick="mode=\'in\';auth()">دخول</button><button class="'+(mode=='up'?'':'g')+'" onclick="mode=\'up\';auth()">حساب جديد</button></div>'+(mode=='up'?'<input id="n" placeholder="الاسم">':'')+'<input id="e" type="email" placeholder="البريد الإلكتروني">'+pw('p','كلمة السر (6 أحرف على الأقل)')+'<div class="err" id="er"></div><button style="width:100%" onclick="go()">'+(mode=='in'?'دخول':'إنشاء حساب')+'</button></div>';
}
function go(){
 var e=$('e').value.trim().toLowerCase(),p=$('p').value,u=users(),er=$('er');
 if(!/^\S+@\S+\.\S+$/.test(e)){er.textContent='اكتب بريد إلكتروني صحيح';return}
 if(p.length<6){er.textContent='كلمة السر لازم 6 أحرف على الأقل';return}
 var h=enc(p);
 if(mode=='up'){
  var n=$('n').value.trim();if(!n){er.textContent='اكتب اسمك';return}
  if(u[e]){er.textContent='البريد ده مسجل قبل كده، سجّل دخول';return}
  u[e]={name:n,pw:h};save('cu',u);
 }else if(!u[e]||u[e].pw!==h){er.textContent='البريد أو كلمة السر غلط';return}
 save('cs',{role:'student',email:e});location.hash='courses';route();
}

/* ---------- دخول الأدمن ---------- */
function adminLogin(){
 $('app').innerHTML='<div class="auth"><button class="g" onclick="location.hash=\'\'">→ رجوع</button><h2>دخول الأدمن 🛠️</h2><input id="au" placeholder="اسم المستخدم" autocomplete="off">'+pw('ap','كلمة السر')+'<div class="err" id="er"></div><button style="width:100%" onclick="adminGo()">دخول</button></div>';
}
function adminGo(){
 if($('au').value.trim()===ADMIN.u&&$('ap').value===adminPw()){save('cs',{role:'admin'});location.hash='admin';route()}
 else $('er').textContent='اسم المستخدم أو كلمة السر غلط';
}
function out(){save('cs',null);location.hash='';route()}
function head(){
 var s=sess();
 $('hu').innerHTML=!s?'':'<span>'+(s.role=='admin'?'🛠️ أدمن':'👤 '+esc(users()[s.email].name))+'</span><button class="g" onclick="pwModal()" title="تغيير كلمة السر">🔑</button><button class="g" onclick="out()">خروج</button>';
}

/* ---------- لوحة الأدمن (مع مراجعة المدفوعات) ---------- */
function admin(){
 var cs=courses(),u=users(),p=prog(),y=txns(),em=Object.keys(u),enr=0,rev=0,fin=0,pendingList=[];
 em.forEach(function(e){
  Object.keys(p[e]||{}).forEach(function(id){
   if(findCourse(id)){
    enr++;
    if(p[e][id].length==L.length)fin++;
   }
  });
  Object.keys(y[e]||{}).forEach(function(id){
   var t=y[e][id],c=findCourse(id);
   if(c){
    if(t.status==='paid')rev+=t.amount;
    else if(t.status==='pending')pendingList.push({email:e,name:u[e].name,courseId:id,courseTitle:c.title,tx:t});
   }
  });
 });
 function st(ic,t,v){return '<div class="st">'+ic+'<b>'+v+'</b><span class="mu">'+t+'</span></div>'}
 var h='<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h2>🛠️ لوحة الأدمن</h2><button onclick="addCourseModal()">+ إضافة كورس جديد</button></div>';
 h+='<div class="stats">'+st('👥','الطلاب المسجلين',em.length)+st('📚','إجمالي الكورسات',cs.length)+st('📝','الاشتراكات النشطة',enr)+st('💰','الإيرادات المؤكدة (ج.م)',rev)+st('⏳','طلبات دفع معلقة',pendingList.length)+'</div>';

 // قسم مراجعة التحويلات المعلقة (إنستا باي / فوري)
 if(pendingList.length){
  h+='<div class="box" style="border-color:var(--wn);margin-bottom:20px"><h3 style="margin-top:0;color:var(--wn)">⏳ طلبات دفع بانتظار المراجعة والتفعيل ('+pendingList.length+')</h3><div class="tw"><table><tr><th>الطالب</th><th>الكورس</th><th>الطريقة</th><th>التفاصيل / الإيصال</th><th>الإجراء</th></tr>';
  pendingList.forEach(function(item){
   var proofHtml=item.tx.receipt?'<button class="sm g" onclick="viewReceiptImg(\''+item.email+'\',\''+item.courseId+'\')">🖼️ عرض الإيصال</button>':'<span class="mu">كود مرجعي: '+esc(item.tx.ref||'—')+'</span>';
   h+='<tr><td><b>'+esc(item.name)+'</b><br><small class="mu" dir="ltr">'+esc(item.email)+'</small></td><td>'+esc(item.courseTitle)+'<br><b>'+item.tx.amount+' ج.م</b></td><td>'+esc(item.tx.method)+'</td><td>'+proofHtml+'</td><td><div class="act"><button class="sm ok" onclick="approveTx(\''+item.email+'\',\''+item.courseId+'\')">تفعيل ✓</button><button class="sm dg" onclick="rejectTx(\''+item.email+'\',\''+item.courseId+'\')">رفض ✕</button></div></td></tr>';
  });
  h+='</table></div></div>';
 }

 h+='<h3>إدارة الكورسات وطلابها</h3>';
 if(!cs.length)h+='<div class="box mu">لا توجد كورسات حالياً. اضغط على "إضافة كورس جديد".</div>';
 cs.forEach(function(c){
  var rows=em.filter(function(e){return p[e]&&p[e][c.id]}),sum=0;
  var t=rows.map(function(e){
   var d=p[e][c.id].length,pc=Math.round(d/L.length*100);sum+=pc;
   var method=(y[e]&&y[e][c.id])?y[e][c.id].method:'—';
   return '<tr><td>'+esc(u[e].name)+'</td><td dir="ltr">'+esc(e)+'</td><td>'+esc(method)+'</td><td>'+d+' من '+L.length+'</td><td><div class="bar"><i style="width:'+pc+'%"></i></div>'+pc+'%</td></tr>';
  }).join('');
  var statusTag=c.available?'<span class="tag av">Available</span>':'<span class="tag un">Unavailable</span>';
  var toggleBtn='<button class="sm '+(c.available?'g':'ok')+'" onclick="event.preventDefault();toggleCourse(\''+c.id+'\')">'+(c.available?'Set Unavailable':'Set Available')+'</button>';
  var delBtn='<button class="sm dg" onclick="event.preventDefault();delCourse(\''+c.id+'\')">حذف</button>';
  h+='<details class="box"><summary><div><b>'+esc(c.icon)+' '+esc(c.title)+'</b> ('+c.price+' ج.م) — '+rows.length+' طالب'+(rows.length?' (متوسط التقدم '+Math.round(sum/rows.length)+'%)':'')+'</div><div class="act">'+statusTag+toggleBtn+delBtn+'</div></summary>'+
   '<p class="mu" style="margin:8px 0 0">'+esc(c.desc)+'</p>'+
   (rows.length?'<div class="tw"><table><tr><th>الطالب</th><th>البريد</th><th>طريقة الدفع</th><th>المحاضرات</th><th>التقدم</th></tr>'+t+'</table></div>':'<p class="mu">مفيش طلاب مسجلين لسه.</p>')+'</details>';
 });
 $('app').innerHTML=h;
}

function approveTx(email,courseId){
 var y=txns(),p=prog();
 if(y[email]&&y[email][courseId]){
  y[email][courseId].status='paid';
  y[email][courseId].approvedAt=new Date().toISOString();
  save('cy',y);
  p[email]=p[email]||{};
  if(!p[email][courseId])p[email][courseId]=[];
  save('cp',p);
  admin();
 }
}
function rejectTx(email,courseId){
 if(!confirm('هل تريد رفض طلب الدفع هذا؟'))return;
 var y=txns();
 if(y[email]&&y[email][courseId]){
  delete y[email][courseId];
  save('cy',y);
  admin();
 }
}
function viewReceiptImg(email,courseId){
 var y=txns(),t=y[email]&&y[email][courseId];if(!t)return;
 var m=document.createElement('div');m.className='mo';m.id='mo';
 m.innerHTML='<div class="md"><h3>🖼️ إيصال التحويل البنكي / إنستا باي</h3><p class="mu">مرسل من: <b>'+esc(t.senderInfo||'غير محدد')+'</b></p>'+
  (t.receipt?'<img src="'+t.receipt+'" style="width:100%;max-height:320px;object-fit:contain;border-radius:10px;border:1px solid var(--bd)">':'<p class="mu">لا توجد صورة مرفقة</p>')+
  '<div class="r2" style="margin-top:12px"><button class="ok" style="flex:1" onclick="closePay();approveTx(\''+email+'\',\''+courseId+'\')">قبول وتفعيل الكورس ✓</button><button class="g" onclick="closePay()">إغلاق</button></div></div>';
 document.body.appendChild(m);
}

function toggleCourse(id){
 var cs=courses(),c=cs.find(function(x){return x.id===id});
 if(c){c.available=!c.available;save('cc',cs);admin();}
}
function delCourse(id){
 var c=findCourse(id);
 if(!c||!confirm('هل أنت متأكد من حذف كورس "'+c.title+'" نهائياً؟'))return;
 var cs=courses().filter(function(x){return x.id!==id});
 save('cc',cs);
 var p=prog();
 Object.keys(p).forEach(function(e){if(p[e]&&p[e][id])delete p[e][id]});
 save('cp',p);
 admin();
}
function addCourseModal(){
 var m=document.createElement('div');m.className='mo';m.id='mo';
 m.innerHTML='<div class="md"><h3>➕ إضافة كورس جديد</h3>'+
  '<input id="ct" placeholder="اسم الكورس (مثال: تطوير الألعاب)">'+

function list(){

 var h='<h2>الكورسات المتاحة</h2>';

 h+='<div class="grid">';
 cs.forEach(function(c){

  else if(tx&&tx.status==='pending')b='<span class="bd pend">⏳ قيد المراجعة</span>';
  h+='<div class="c" onclick="location.hash=\'course-'+c.id+'\'"><div class="po" style="background:linear-gradient(135deg,'+G[c.g]+')">'+esc(c.icon)+b+'</div><div class="cb"><h3>'+esc(c.title)+'</h3><p>'+esc(c.desc)+'</p>'+(p||(tx&&tx.status==='pending')?'':'<p><b>'+c.price+' ج.م</b></p>')+'</div></div>';
 });

function course(id){
 var c=findCourse(id);
 if(!c||!c.available){list();return}
 var p=myp(id),tx=myTx(id),done=p||[],pct=Math.round(done.length/L.length*100),nxt=0;
 while(done.indexOf(nxt)>-1&&nxt<L.length)nxt++;
 var h='<button class="g" onclick="location.hash=\'courses\'">→ رجوع للكورسات</button><div class="hero" style="margin-top:14px;background:linear-gradient(135deg,'+G[c.g]+')"><div class="e">'+esc(c.icon)+'</div><div><h1>'+esc(c.title)+'</h1><p>'+esc(c.desc)+'</p></div></div><div class="box">';
 if(p){
  h+='<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><b>✅ أنت مسجّل في الكورس</b>'+(tx?'<button class="sm g" onclick="showReceiptModal(\''+id+'\')">🧾 عرض فاتورة الدفع</button>':'')+'</div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="mu">أنجزت '+done.length+' من '+L.length+' دروس ('+pct+'%) — '+(nxt<L.length?'وصلت لحد: الدرس '+(nxt+1)+' ('+L[nxt].replace('%',esc(c.title))+')':'🎉 خلصت الكورس كله')+'</div>';
 }else if(tx&&tx.status==='pending'){
  h+='<b>⏳ طلب اشتراكك قيد المراجعة</b><p class="mu" style="margin:4px 0 8px">تم استلام طلب الدفع عبر <b>'+esc(tx.method)+'</b> (رقم المرجع: <code>'+esc(tx.ref)+'</code>). سيتم تفعيل الكورس فور تأكيد العملية من الإدارة.</p><button class="sm g" onclick="showReceiptModal(\''+id+'\')">🧾 تفاصيل الطلب</button>';
 }else{
  h+='<b>أنت لسه مش مسجّل في الكورس ده</b><p class="mu" style="margin:4px 0 10px">تقدر تشوف المحتوى، وسجّل الآن بأكثر من طريقة دفع آمنة.</p><button onclick="pay(\''+id+'\')">سجّل في الكورس — '+c.price+' ج.م</button>';
 }
 h+='</div><div class="box"><h3 style="margin-top:0">محتوى الكورس</h3>';
 L.forEach(function(t,k){var d=done.indexOf(k)>-1;
  h+='<div class="les'+(d?' d':'')+(p&&k==nxt?' cur':'')+'"><span>'+(d?'✔ ':'▶ ')+'الدرس '+(k+1)+': '+t.replace('%',esc(c.title))+'</span>'+(d?'<span class="mu">تم</span>':'<button class="'+(p?'ok':'g')+'" onclick="mark(\''+id+'\','+k+')">'+(p?'تم الدرس':'🔒 سجّل للبدء')+'</button>')+'</div>'});
 $('app').innerHTML=h+'</div>';
}

function mark(id,k){
 if(!myp(id)){
  var tx=myTx(id);
  if(tx&&tx.status==='pending'){alert('طلب اشتراكك قيد المراجعة حالياً وسيتم فتح الدروس فور التفعيل.');return}
  pay(id);return;
 }
 var p=prog(),e=me();if(p[e][id].indexOf(k)<0)p[e][id].push(k);save('cp',p);course(id)
}

/* تنسيق البطاقة والتحقق منها */
function formatCard(el){
 var v=el.value.replace(/\D/g,'').slice(0,16);
 el.value=v.replace(/(.{4})/g,'$1 ').trim();
 var ct=$('ctype');
 if(/^4/.test(v))ct.textContent='VISA';
 else if(/^5[1-5]/.test(v)||/^2[2-7]/.test(v))ct.textContent='MasterCard';
 else if(/^5078/.test(v))ct.textContent='Meeza 🇪🇬';
 else ct.textContent='';
}
function formatExp(el){
 var v=el.value.replace(/\D/g,'').slice(0,4);
 if(v.length>=3)el.value=v.slice(0,2)+'/'+v.slice(2);
 else el.value=v;
}
function copyTxt(txt,btn){
 navigator.clipboard.writeText(txt);
 var old=btn.textContent;btn.textContent='تم النسخ ✓';setTimeout(function(){btn.textContent=old},1500);
}
function handleReceiptFile(input){
 var file=input.files&&input.files[0];if(!file)return;
 var reader=new FileReader();
 reader.onload=function(e){receiptBase64=e.target.result};
 reader.readAsDataURL(file);
}

/* 1. معالجة الدفع بالبطاقة البنكية */
function processCardPay(id){
 var c=findCourse(id),er=$('pe'),now=new Date();
 var n=$('cn').value.replace(/\s/g,''),ch=$('ch').value.trim(),ex=/^(0[1-9]|1[0-2])\/(\d\d)$/.exec($('ce').value);
 if(!/^\d{16}$/.test(n)){er.textContent='رقم البطاقة يجب أن يكون 16 رقماً';return}
 if(ch.length<3){er.textContent='اكتب اسم حامل البطاقة بشكل صحيح';return}
 if(!ex){er.textContent='تاريخ الانتهاء بصيغة MM/YY';return}
 var yr=2000+Number(ex[2]);
 if(yr<now.getFullYear()||(yr==now.getFullYear()&&Number(ex[1])<now.getMonth()+1)){er.textContent='البطاقة منتهية الصلاحية';return}
 if(!/^\d{3}$/.test($('cc').value)){er.textContent='رمز CVV المكون من 3 أرقام مطلوب';return}

 er.textContent='';
 $('pb').disabled=true;$('pb').textContent='⏳ جاري الاتصال بالبنك (3D Secure)...';
 setTimeout(function(){
  var ref='TXN-'+Date.now().toString().slice(-8);
  completeEnrollment(id,{
   amount:c.price,
   method:'بطاقة بنكية (•••• '+n.slice(-4)+')',
   status:'paid',
   ref:ref,
   date:new Date().toISOString()
  },true);
 },1800);
}

/* 2. معالجة الدفع بالمحفظة الإلكترونية */
var walletStep=1,generatedOtp='';
function processWalletPay(id){
 var c=findCourse(id),er=$('pe'),num=$('wnum').value.trim();
 if(!/^01[0125]\d{8}$/.test(num)){er.textContent='أدخل رقم هاتف مصري صحيح (11 رقم)';return}
 er.textContent='';
 if($('otp-area').style.display==='none'){
  generatedOtp=String(Math.floor(100000+Math.random()*900000));
  $('pb').disabled=true;$('pb').textContent='⏳ جاري إرسال رسالة التأكيد...';
  setTimeout(function(){
   $('pb').disabled=false;
   $('otp-area').style.display='block';
   $('pb').textContent='تأكيد الدفع ('+c.price+' ج.م)';
   alert('📩 رسالة محفظة الكاش:\nكود تأكيد عملية الدفع بمبلغ '+c.price+' ج.م هو: '+generatedOtp);
  },1000);
 }else{
  var otp=$('wotp').value.trim();
  if(otp!==generatedOtp){er.textContent='كود التحقق غير صحيح (الكود المرسل: '+generatedOtp+')';return}
  $('pb').disabled=true;$('pb').textContent='⏳ جاري خصم الرصيد وتفعيل الكورس...';
  setTimeout(function(){
   var ref='WLT-'+Date.now().toString().slice(-8);
   completeEnrollment(id,{
    amount:c.price,
    method:'محفظة إلكترونية ('+num+')',
    status:'paid',
    ref:ref,
    date:new Date().toISOString()
   },true);
  },1400);
 }
}

/* 3. معالجة الدفع عبر إنستا باي */

/* ---------- كلمة السر ---------- */
function pw(id,ph){return '<div class="pw"><input id="'+id+'" type="password" placeholder="'+ph+'"><button type="button" onclick="eye(\''+id+'\',this)" title="إظهار/إخفاء">👁️</button></div>'}
function eye(id,b){var x=$(id);x.type=x.type=='password'?'text':'password';b.textContent=x.type=='password'?'👁️':'🙈'}
function enc(p){return btoa(unescape(encodeURIComponent(p)))}
function adminPw(){return get('ca',ADMIN.p)}
function pwModal(){
 var m=document.createElement('div');m.className='mo';m.id='mo';
 m.innerHTML='<div class="md"><h3>🔑 تغيير كلمة السر</h3>'+pw('pc','كلمة السر الحالية')+pw('pn','الجديدة (6 أحرف على الأقل)')+pw('pf','أعد كتابة الجديدة')+'<div class="err" id="pe"></div><button style="width:100%" onclick="doChange()">حفظ</button><button class="g" style="width:100%;margin-top:8px" onclick="closePay()">إلغاء</button></div>';
 document.body.appendChild(m);
}
function doChange(){
 var s=sess(),cur=$('pc').value,n=$('pn').value,er=$('pe'),u=users();
 var ok=s.role=='admin'?cur===adminPw():u[s.email].pw===enc(cur);
 if(!ok){er.textContent='كلمة السر الحالية غلط';return}
 if(n.length<6){er.textContent='الجديدة لازم 6 أحرف على الأقل';return}
 if(n!==$('pf').value){er.textContent='كلمتين السر مش متطابقتين';return}
 if(s.role=='admin')save('ca',n);else{u[s.email].pw=enc(n);save('cu',u)}
 $('mo').firstChild.innerHTML='<div style="text-align:center"><div style="font-size:3rem">✅</div><h3>تم تغيير كلمة السر</h3><button onclick="closePay()">تمام</button></div>';
}

function route(){
 var h=location.hash.slice(1),s=sess();head();window.scrollTo(0,0);

 if(s.role=='admin'){admin();return}
 var m=/^course-(.+)$/.exec(h);
 if(m&&findCourse(m[1]))course(m[1]);else list();
}
window.addEventListener('hashchange',route);route();
