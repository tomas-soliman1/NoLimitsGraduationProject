
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body style="background-color: rgb(41, 136, 204);">
    
 <form  class="w-50 p-4 rounded-3 my-5 m-auto bg-info">
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Product Name:</label>
    <input type="text" class="form-control" id="productName" aria-describedby="emailHelp">
    <!-- <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div> -->
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Product Price</label>
    <input type="number" class="form-control" id="productPrice">
  </div>
   <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Product Category</label>
    <input type="text" class="form-control" id="productCategory">
  </div>
   <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Product Description</label>
    <textarea cols="50" rows="5" name="" id="productDesc"></textarea>
  </div>
  <button type="submit" id="submitBtn" class="btn btn-primary">Submit</button>
</form>

<table class="table w-75 m-auto  table-info" >
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Product Name</th>
      <th scope="col">Product Price</th>
      <th scope="col">Product Category</th>
      <th scope="col">Product Description</th>
    </tr>

  </thead>
  <tbody id="tableBody">
    <tr>
      <th scope="row">1</th>
      <td>Mark</td>
      <td>Otto</td>
      <td>@mdo</td>
      <td>@mdo</td>
    </tr>
   
  </tbody>
</table>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script >
      
var productName = document.getElementById("productName");
var productPrice = document.getElementById("productPrice");
var productCategory= document.getElementById("productCategory")
var productDesc= document.getElementById("productDesc")
var submitBtn =document.getElementById("submitBtn")

var tableBody = document.getElementById("tableBody")

var products =[]


submitBtn.addEventListener("click", function(e){
    e.preventDefault()
    var id =0
    if(products.length >0){
        id =products[products.length -1].id + 1
    }else{
        id=1
    }
    var productData={
        id: id ,
        name:productName.value,
        price: productPrice.value,
        category: productCategory.value,
        description: productDesc.value
    }

    products.push(productData)

    console.log(productData,"product");
console.log(products);

viewProducts()
    
})


function viewProducts(){
    var cartona="";
    for(var i=0; i<products.length; i++){
     cartona += `<tr>
      <th scope="row">${products[i].id}</th>
      <td>${products[i].name}</td>
      <td>${products[i].price}</td>
      <td>${products[i].category}</td>
      <td>${products[i].description}</td>
    </tr>   
     `
tableBody.innerHTML = cartona
}
}
    </script>
</body>
</html>
